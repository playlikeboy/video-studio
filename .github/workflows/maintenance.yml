name: Repository maintenance
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate presets, manifests and skill metadata
        run: python scripts/validate_assets.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile helper modules
        run: python -m compileall -q scripts tests
      - name: Check package metadata and Skill entry point
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          assert package["name"] == "@playlikeboy/video-studio"
          assert package["license"] == "MIT"
          assert Path("skills/video-studio/SKILL.md").is_file()
          assert Path("skills/video-studio/references/licensing.md").is_file()
          print("Repository metadata and portable Skill bundle are present.")
          PY
